<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f4"><title>Food Log</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20211f;background:#f7f7f4;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:28px 16px 56px}.app{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#77796f;font-weight:700}.title{font-size:30px;letter-spacing:-.04em;margin:5px 0}.sub{color:#77796f;font-size:14px}.date-wrap{display:flex;align-items:center;gap:8px}.panel{background:#fff;border:1px solid #e7e7e0;border-radius:18px;padding:20px;margin-bottom:16px}.panel h2{font-size:16px;margin:0 0 16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px}.field.wide{grid-column:1/-1}label{font-size:12px;font-weight:650;color:#65675e}input,select,textarea{font:inherit;font-size:14px;width:100%;border:1px solid #dedfd7;border-radius:10px;background:#fff;padding:11px 12px;color:#20211f;outline:none}input:focus,select:focus,textarea:focus{border-color:#55594b;box-shadow:0 0 0 3px #55594b12}button{font:inherit;border:0;border-radius:10px;padding:11px 14px;font-weight:650;cursor:pointer}.primary{background:#252720;color:white}.secondary{background:#f0f0eb;color:#33352e}.danger{background:#fff0ed;color:#a13d2a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.stats{display:flex;justify-content:space-between;align-items:center;gap:12px}.count{font-size:27px;letter-spacing:-.04em;font-weight:750}.muted{color:#77796f;font-size:13px}.entries{display:flex;flex-direction:column;gap:9px}.entry{border:1px solid #e9e9e3;border-radius:13px;padding:13px;display:flex;align-items:flex-start;gap:12px}.time{font-variant-numeric:tabular-nums;color:#73766b;font-size:12px;min-width:55px;padding-top:3px}.entrymain{min-width:0;flex:1}.food{font-weight:700;font-size:14px;overflow-wrap:anywhere}.detail{font-size:13px;color:#77796f;margin-top:4px;overflow-wrap:anywhere}.entrybuttons{display:flex;gap:5px}.small{font-size:12px;padding:7px 9px}.empty{text-align:center;padding:26px 12px;color:#77796f;font-size:14px}.footer{font-size:12px;color:#898b81;text-align:center;margin-top:18px}.hidden{display:none!important}@media(max-width:520px){body{padding:20px 12px 40px}.top{align-items:flex-start;flex-direction:column}.date-wrap{width:100%}.formgrid{grid-template-columns:1fr 1fr}.panel{padding:16px}.entry{gap:8px}.time{min-width:46px}.entrybuttons{flex-direction:column}}
</style></head>
<body><main class="app">
<header class="top"><div><div class="eyebrow">Daily journal</div><h1 class="title">Food log</h1><div class="sub">A simple record of what you ate, how much, and when.</div></div><div class="date-wrap"><label for="day" class="hidden">Log date</label><input id="day" type="date" aria-label="Log date"></div></header>
<section class="panel"><h2 id="formTitle">Add food</h2><form id="foodForm"><div class="formgrid">
<div class="field wide"><label for="food">What did you eat? *</label><input id="food" required maxlength="120" placeholder="e.g. Chicken and rice"></div>
<div class="field"><label for="amount">Approx. amount</label><input id="amount" maxlength="60" placeholder="e.g. 1 bowl, 150 g"></div>
<div class="field"><label for="time">Time *</label><input id="time" type="time" required></div>
<div class="field"><label for="meal">Meal (optional)</label><select id="meal"><option value="">Choose…</option><option>Breakfast</option><option>Lunch</option><option>Snack</option><option>Dinner</option><option>Drink</option><option>Other</option></select></div>
<div class="field"><label for="notes">Notes (optional)</label><input id="notes" maxlength="160" placeholder="e.g. with 1 tsp oil"></div>
</div><div class="actions"><button class="primary" type="submit" id="saveBtn">Add entry</button><button class="secondary hidden" type="button" id="cancelEdit">Cancel edit</button></div></form></section>
<section class="panel"><div class="stats"><div><div class="muted">Entries for this day</div><div class="count" id="entryCount">0</div></div><div class="actions" style="margin:0"><button class="secondary" id="exportBtn" type="button">Export CSV</button><button class="secondary" id="clearBtn" type="button">Clear day</button></div></div></section>
<section class="panel"><h2>Today's entries</h2><div id="entries" class="entries"></div></section>
<div class="footer">Saved in this browser on this device. Export CSV regularly to keep a backup.</div>
</main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const storageKey='minimal-food-log-v1';let all=[];let editingId=null;
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const nowTime=()=>{const d=new Date();return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
try{all=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(all))all=[]}catch{all=[]}
$('day').value=localDate();$('time').value=nowTime();
function persist(){localStorage.setItem(storageKey,JSON.stringify(all));render()}
function resetForm(){editingId=null;$('foodForm').reset();$('time').value=nowTime();$('formTitle').textContent='Add food';$('saveBtn').textContent='Add entry';$('cancelEdit').classList.add('hidden')}
function render(){const day=$('day').value||localDate();const items=all.filter(x=>x.date===day).sort((a,b)=>a.time.localeCompare(b.time)||a.createdAt-b.createdAt);$('entryCount').textContent=items.length;$('entries').replaceChildren();if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='Nothing logged yet. Add your first entry above.';$('entries').append(e);return}for(const item of items){const row=document.createElement('div');row.className='entry';const time=document.createElement('div');time.className='time';time.textContent=item.time;const main=document.createElement('div');main.className='entrymain';const food=document.createElement('div');food.className='food';food.textContent=item.food;main.append(food);const detail=document.createElement('div');detail.className='detail';detail.textContent=[item.amount,item.meal,item.notes].filter(Boolean).join(' · ')||'No extra details';main.append(detail);const buttons=document.createElement('div');buttons.className='entrybuttons';const edit=document.createElement('button');edit.className='secondary small';edit.textContent='Edit';edit.onclick=()=>editItem(item.id);const del=document.createElement('button');del.className='danger small';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this food entry?')){all=all.filter(x=>x.id!==item.id);if(editingId===item.id)resetForm();persist()}};buttons.append(edit,del);row.append(time,main,buttons);$('entries').append(row)}}
function editItem(id){const x=all.find(y=>y.id===id);if(!x)return;editingId=id;$('food').value=x.food;$('amount').value=x.amount;$('time').value=x.time;$('meal').value=x.meal;$('notes').value=x.notes;$('formTitle').textContent='Edit food';$('saveBtn').textContent='Save changes';$('cancelEdit').classList.remove('hidden');$('food').focus();window.scrollTo({top:0,behavior:'smooth'})}
$('foodForm').addEventListener('submit',e=>{e.preventDefault();const item={id:editingId||`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,date:$('day').value||localDate(),food:$('food').value.trim(),amount:$('amount').value.trim(),time:$('time').value,meal:$('meal').value,notes:$('notes').value.trim(),createdAt:Date.now()};if(!item.food||!item.time)return;if(editingId){const i=all.findIndex(x=>x.id===editingId);if(i>=0)all[i]={...all[i],...item}}else all.push(item);persist();resetForm()});
$('cancelEdit').onclick=resetForm;$('day').addEventListener('change',()=>{if(editingId)resetForm();render()});
$('clearBtn').onclick=()=>{const day=$('day').value||localDate();if(!all.some(x=>x.date===day))return;if(confirm(`Clear all entries for ${day}? This cannot be undone.`)){all=all.filter(x=>x.date!==day);persist();resetForm()}};
$('exportBtn').onclick=()=>{const headers=['Date','Time','Food','Approx amount','Meal','Notes'];const rows=all.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)).map(x=>[x.date,x.time,x.food,x.amount,x.meal,x.notes]);const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`food-log-${$('day').value||localDate()}.csv`;a.click();URL.revokeObjectURL(url)};
render();})();
</script></body></html>
